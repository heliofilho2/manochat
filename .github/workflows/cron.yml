name: Scheduled jobs

# Optional alternative to an external scheduler (cron-job.org). It is DISABLED
# for scheduled runs here because the crons run on cron-job.org; only the
# manual "Run workflow" button works. To use GitHub Actions as the scheduler
# instead, uncomment the `schedule:` block below.
#
# The daily refresh-token job stays in vercel.json.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      your public URL, e.g. https://seu-app.vercel.app  (no trailing slash)
#   CRON_SECRET  same value as the Vercel env var
#
# Note: GitHub's scheduled runs can be delayed several minutes under load.
# GitHub disables scheduled workflows after 60 days with no repo activity; the
# weekly `keepalive` job below refreshes that timer so the schedule keeps running.

on:
  # schedule:
  #   - cron: "*/5 * * * *"   # process-events
  #   - cron: "*/15 * * * *"  # sync-inbox (also runs on the */5 tick every 15 min)
  #   - cron: "0 6 * * 1"     # keepalive (weekly, Mondays 06:00 UTC)
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [process-events, sync-inbox, both]
        default: both

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  process-events:
    if: github.event_name == 'schedule' || inputs.job == 'process-events' || inputs.job == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger process-events
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/process-events")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]

  # Keeps this workflow's schedule from being auto-disabled after 60 days of
  # repo inactivity. Runs weekly, well inside the window; re-enables the
  # workflow via the API (GITHUB_TOKEN) and only commits a no-op if needed.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2

  sync-inbox:
    # Only on the 15-minute cron line, or manual dispatch.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      inputs.job == 'sync-inbox' || inputs.job == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-inbox
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-inbox")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]
