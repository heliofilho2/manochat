<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f5f0" />
    <title>Sem conexão — Oslinke</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f5f0;
        color: #2b2724;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 340px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
      .mark { width: 56px; height: 56px; background: #f08c6e; border-radius: 20px 20px 20px 6px; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0; color: #7a716a; line-height: 1.5; font-size: 15px; }
      button {
        margin-top: 6px; height: 48px; padding: 0 22px; border: 0; border-radius: 14px;
        background: #2b2724; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1>Sem conexão</h1>
      <p>Suas automações continuam rodando normalmente. Assim que a internet voltar, é só tentar de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
