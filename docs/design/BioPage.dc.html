<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F8F5F0;color:#2B2724;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#B25A3E;text-decoration:underline;text-underline-offset:3px}
a:hover{color:#2B2724}
button,input,textarea,select{font-family:inherit}
button{transition:background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .2s ease}
button:active{transform:scale(.98)}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes mspin{to{transform:rotate(360deg)}}
@keyframes mup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes mgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<script src="./mc-data.js"></script>
</helmet>
<div style="min-height:{{ minH }};background:{{ t.bg }};color:{{ t.ink }};transition:background .25s,color .25s">
  <sc-if value="{{ showBack }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ back }}" style="white-space:nowrap;position:fixed;top:12px;left:12px;z-index:5;height:40px;padding:0 14px;border-radius:999px;border:none;background:#2B2724;color:#FFFFFF;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)">← Voltar ao editor</button>
  </sc-if>
  <div style="max-width:480px;margin:0 auto;padding:{{ pad }};display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
      <div style="width:96px;height:96px;border-radius:50%;overflow:hidden;background:{{ avatarTone }};display:flex;align-items:center;justify-content:center;border:3px solid {{ t.card }};box-shadow:0 0 0 1.5px {{ t.line }}">
        <sc-if value="{{ photo }}" hint-placeholder-val="{{ false }}"><img src="{{ photo }}" alt="Foto de perfil" style="width:100%;height:100%;object-fit:cover"></sc-if>
        <sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}"><span style="font:700 32px 'Plus Jakarta Sans',sans-serif;color:#2B2724">{{ initials }}</span></sc-if>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font:{{ t.dispWeight }} 24px/1.1 {{ t.display }};letter-spacing:-0.02em">@{{ user }}</span>
        <sc-if value="{{ showFollowers }}" hint-placeholder-val="{{ true }}"><span style="font:500 14px 'Plus Jakarta Sans',sans-serif;color:{{ t.muted }}">{{ followers }} seguidores</span></sc-if>
      </div>
      <sc-if value="{{ bio }}"><p style="margin:0;max-width:360px;font:400 15px/1.5 'Plus Jakarta Sans',sans-serif;color:{{ t.ink }};text-wrap:pretty;white-space:pre-wrap">{{ bio }}</p></sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <sc-if value="{{ r.isAuto }}">
          <div style="animation:mup .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:{{ r.delay }};display:flex;flex-direction:column;border-radius:{{ radius }};background:{{ t.btnBg }};color:{{ t.btnFg }};border:1.5px solid {{ t.btnLine }};overflow:hidden">
            <button onClick="{{ r.toggle }}" style="white-space:nowrap;display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;border:none;background:transparent;color:inherit;text-align:left;cursor:pointer;width:100%">
              <span style="width:36px;height:36px;border-radius:11px 11px 11px 3px;background:{{ t.accent }};color:{{ t.accentFg }};display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l2-5.2a8.4 8.4 0 1 1 16-4.3z"></path></svg></span>
              <span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
                <span style="font:600 15px/1.3 'Plus Jakarta Sans',sans-serif">Comente <span style="font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:0.03em">{{ r.keyword }}</span> no vídeo e receba na DM</span>
                <span style="font:400 13px/1.3 'Plus Jakarta Sans',sans-serif;opacity:0.75">{{ r.label }}</span>
              </span>
              <span style="font:500 18px 'Plus Jakarta Sans',sans-serif;opacity:0.7;transform:rotate({{ r.rot }});transition:transform .2s">+</span>
            </button>
            <sc-if value="{{ r.open }}">
              <div style="display:flex;gap:12px;padding:0 16px 16px;animation:mup .4s cubic-bezier(.2,.7,.2,1)">
                <sc-if value="{{ r.post }}"><div style="position:relative;width:64px;height:80px;border-radius:10px;overflow:hidden;flex-shrink:0"><dc-import name="PostThumb" style="position:absolute;inset:0;display:block" post="{{ r.post }}" caption="{{ false }}" hint-size="100%,100%"></dc-import></div></sc-if>
                <div style="flex:1;display:flex;flex-direction:column;gap:8px;font:400 13px/1.45 'Plus Jakarta Sans',sans-serif">
                  <span>1. Abra o post · 2. Comente <strong style="font-family:'Plus Jakarta Sans',sans-serif">{{ r.keyword }}</strong> · 3. Confira sua DM</span>
                  <a href="#" onClick="{{ r.noop }}" style="align-self:flex-start;display:flex;align-items:center;height:36px;padding:0 14px;border-radius:10px;background:{{ t.accent }};color:{{ t.accentFg }};font:600 13px 'Plus Jakarta Sans',sans-serif;text-decoration:none">Abrir post no Instagram ↗</a>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ r.isManual }}">
          <a href="{{ r.url }}" onClick="{{ r.noop }}" style-hover="transform:translateY(-2px)" style="transition:transform .3s cubic-bezier(.2,.7,.2,1);animation:mup .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:{{ r.delay }};display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 44px;border-radius:{{ radius }};background:{{ t.card }};color:{{ t.ink }};border:1.5px solid {{ t.line }};font:600 15px 'Plus Jakarta Sans',sans-serif;text-decoration:none;text-align:center;position:relative">{{ r.label }}<span style="position:absolute;right:16px;opacity:0.5">↗</span></a>
        </sc-if>
      </sc-for>
    </div>

    <sc-if value="{{ showPosts }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font:600 12px 'Plus Jakarta Sans',sans-serif;letter-spacing:0.06em;color:{{ t.muted }}">ÚLTIMOS POSTS</span>
        <sc-if value="{{ lay.grid3 }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden">
            <sc-for list="{{ gridPosts }}" as="p" hint-placeholder-count="9"><div style="position:relative;aspect-ratio:4/5"><dc-import name="PostThumb" style="position:absolute;inset:0;display:block" post="{{ p }}" caption="{{ false }}" hint-size="100%,100%"></dc-import></div></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ lay.grid2 }}">
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
            <sc-for list="{{ grid2Posts }}" as="p" hint-placeholder-count="6"><div style="position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden"><dc-import name="PostThumb" style="position:absolute;inset:0;display:block" post="{{ p }}" hint-size="100%,100%"></dc-import></div></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ lay.carrossel }}">
          <div style="display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px">
            <sc-for list="{{ gridPosts }}" as="p" hint-placeholder-count="5"><div style="position:relative;flex:0 0 62%;aspect-ratio:4/5;border-radius:16px;overflow:hidden;scroll-snap-align:start"><dc-import name="PostThumb" style="position:absolute;inset:0;display:block" post="{{ p }}" hint-size="100%,100%"></dc-import></div></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ lay.lista }}">
          <div style="display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{ listPosts }}" as="p" hint-placeholder-count="5">
              <div style="display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:{{ t.card }};border:1px solid {{ t.line }}">
                <div style="position:relative;width:52px;height:64px;border-radius:9px;overflow:hidden;flex-shrink:0"><dc-import name="PostThumb" style="position:absolute;inset:0;display:block" post="{{ p }}" caption="{{ false }}" hint-size="100%,100%"></dc-import></div>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 14px 'Plus Jakarta Sans',sans-serif">{{ p.caption }}</span><span style="font:400 12px 'Plus Jakarta Sans',sans-serif;color:{{ t.muted }}">{{ p.type }} · {{ p.date }} · {{ p.likes }} curtidas</span></div>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <div style="display:flex;justify-content:center;padding:8px 0 4px">
      <span style="display:flex;align-items:center;gap:6px;font:500 12px 'Plus Jakarta Sans',sans-serif;color:{{ t.muted }};opacity:0.8"><span style="width:10px;height:10px;border-radius:3px 3px 3px 1px;background:{{ t.muted }}"></span>feito com Manochat</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:820}}">
const THEMES={
 papel:{bg:'#F8F5F0',card:'#FFFFFF',ink:'#2B2724',muted:'#7C756C',line:'#ECE6DD',btnBg:'#2B2724',btnFg:'#FFFFFF',btnLine:'#2B2724',accent:'#F08C6E',accentFg:'#2B2724',display:"'Plus Jakarta Sans',sans-serif",dispWeight:700},
 noite:{bg:'#16130F',card:'#221E18',ink:'#F8F5F0',muted:'#A89F92',line:'#4F4841',btnBg:'#F08C6E',btnFg:'#16130F',btnLine:'#F08C6E',accent:'#16130F',accentFg:'#F4A184',display:"'Plus Jakarta Sans',sans-serif",dispWeight:700},
 laranja:{bg:'#F08C6E',card:'#FDEEE7',ink:'#2B2724',muted:'#3A1A0E',line:'#2B2724',btnBg:'#2B2724',btnFg:'#FDEEE7',btnLine:'#2B2724',accent:'#F08C6E',accentFg:'#2B2724',display:"'Plus Jakarta Sans',sans-serif",dispWeight:800},
 menta:{bg:'#DCEFE4',card:'#F3FBF6',ink:'#0F2A1D',muted:'#3F6452',line:'#B9DCC8',btnBg:'#0F2A1D',btnFg:'#DCEFE4',btnLine:'#0F2A1D',accent:'#7DD3A5',accentFg:'#0F2A1D',display:"'Plus Jakarta Sans',sans-serif",dispWeight:700},
 lilas:{bg:'#E8E3FF',card:'#F7F5FF',ink:'#1C1640',muted:'#4F4880',line:'#CFC6FF',btnBg:'#1C1640',btnFg:'#F7F5FF',btnLine:'#1C1640',accent:'#B6A8FF',accentFg:'#1C1640',display:"'Plus Jakarta Sans',sans-serif",dispWeight:700},
 mono:{bg:'#FFFFFF',card:'#FFFFFF',ink:'#000000',muted:'#555555',line:'#000000',btnBg:'#FFFFFF',btnFg:'#000000',btnLine:'#000000',accent:'#000000',accentFg:'#FFFFFF',display:"'Plus Jakarta Sans',sans-serif",dispWeight:600}};
const RAD={arredondado:'16px',pilula:'999px',reto:'4px'};
class Component extends DCLogic {
  _mc(){ if(!window.MC&&!this.mcI){this.mcI=setInterval(()=>{if(window.MC){clearInterval(this.mcI);this.forceUpdate()}},60)} return window.MC||{}; }
  state={open:null};
  renderVals(){
    const MC=this._mc();const c=this.props.config||MC.bio||{},p=this.props.profile||MC.profile||{},posts=this.props.posts||MC.posts||[],framed=!!this.props.framed;
    const t=THEMES[c.theme]||THEMES.papel,lay=c.postLayout||'grid3';
    const noop=e=>e.preventDefault();
    let ri=0;const rows=(this.props.items||(MC.items&&MC.bio?MC.items(c,MC.automations).filter(i=>!i.hidden):[])).map(it=>({...it,delay:(80+ri++*60)+'ms',isAuto:it.kind==='auto',isManual:it.kind==='manual',url:it.url||'#',
      post:it.postId?posts.find(x=>x.id===it.postId):null,open:this.state.open===it.id,rot:this.state.open===it.id?'45deg':'0deg',
      toggle:()=>this.setState({open:this.state.open===it.id?null:it.id}),noop}));
    return {t,rows,radius:RAD[c.shape]||RAD.arredondado,user:p.user,followers:p.followers,initials:p.initials,avatarTone:p.tone||'#E9C9B4',
      photo:c.photo||'',noPhoto:!c.photo,bio:c.bio||'',showFollowers:c.showFollowers!==false,showPosts:c.showPosts!==false,
      lay:{grid3:lay==='grid3',grid2:lay==='grid2',carrossel:lay==='carrossel',lista:lay==='lista'},
      gridPosts:posts.slice(0,9),grid2Posts:posts.slice(0,6),listPosts:posts.slice(0,5),
      minH:framed?'100%':'100vh',pad:framed?'36px 20px 24px':'48px 20px 28px',
      showBack:!framed&&!!this.props.onBack,back:()=>this.props.onBack&&this.props.onBack()};
  }
}
</script>
</body>
</html>
