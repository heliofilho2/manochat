<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F8F5F0;color:#2B2724;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#B25A3E;text-decoration:underline;text-underline-offset:3px}
a:hover{color:#2B2724}
button,input,textarea,select{font-family:inherit}
button{transition:background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .2s ease}
button:active{transform:scale(.98)}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes mspin{to{transform:rotate(360deg)}}
@keyframes mup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes mgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<script src="./mc-data.js"></script>
</helmet>
<sc-if value="{{ is.landing }}" hint-placeholder-val="{{ true }}">
  <dc-import name="Landing" on-login="{{ login }}" on-legal="{{ goLegal }}" demo-state="{{ demo }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ is.legal }}" hint-placeholder-val="{{ false }}">
  <dc-import name="Legal" kind="{{ route }}" on-back="{{ legalBack }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ is.publicBio }}" hint-placeholder-val="{{ false }}">
  <dc-import name="BioPage" profile="{{ profile }}" config="{{ bio }}" items="{{ bioVisible }}" posts="{{ posts }}" on-back="{{ goBioEditor }}" hint-size="100%,100vh"></dc-import>
</sc-if>

<sc-if value="{{ is.shell }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;min-height:100vh;background:#F8F5F0">
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <aside style="width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:24px 16px;border-right:1px solid #ECE6DD;background:#F8F5F0">
        <button onClick="{{ goDash }}" style="display:flex;align-items:center;gap:9px;background:none;border:none;padding:4px 8px;cursor:pointer;color:#2B2724">
          <span style="width:26px;height:26px;border-radius:9px 9px 9px 3px;background:#F08C6E;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)"></span>
          <span style="font:700 22px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em">manochat</span>
        </button>
        <nav style="display:flex;flex-direction:column;gap:4px">
          <button onClick="{{ goDash }}" style="white-space:nowrap;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;border:none;background:{{ nav.dash.bg }};box-shadow:{{ nav.dash.sh }};color:{{ nav.dash.fg }};font:500 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
            Painel
          </button>
          <button onClick="{{ goAutos }}" style="white-space:nowrap;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;border:none;background:{{ nav.autos.bg }};box-shadow:{{ nav.autos.sh }};color:{{ nav.autos.fg }};font:500 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
            Automações
          </button>
          <button onClick="{{ goInbox }}" style="white-space:nowrap;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;border:none;background:{{ nav.inbox.bg }};box-shadow:{{ nav.inbox.sh }};color:{{ nav.inbox.fg }};font:500 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
            <span style="flex:1">Caixa de entrada</span>
            <span style="min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:#F08C6E;color:#2B2724;font:600 11px/20px 'Plus Jakarta Sans',sans-serif;text-align:center">3</span>
          </button>
          <button onClick="{{ goBioEditor }}" style="white-space:nowrap;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;border:none;background:{{ nav.bio.bg }};box-shadow:{{ nav.bio.sh }};color:{{ nav.bio.fg }};font:500 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:left">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Minha página de bio
          </button>
        </nav>
        <div style="flex:1"></div>
        <button onClick="{{ goOnboarding }}" style="display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;border:1px solid #ECE6DD;background:#FFFFFF;cursor:pointer;text-align:left;color:#2B2724">
          <span style="font:600 13px 'Plus Jakarta Sans',sans-serif">Primeiros passos</span>
          <span style="display:flex;gap:4px;width:100%"><span style="flex:1;height:5px;border-radius:9px;background:#2B2724"></span><span style="flex:1;height:5px;border-radius:9px;background:#2B2724"></span><span style="flex:1;height:5px;border-radius:9px;background:{{ step3 }}"></span></span>
          <span style="font:400 12px 'Plus Jakarta Sans',sans-serif;color:#7C756C">{{ stepsLabel }}</span>
        </button>
        <button onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;border:none;background:transparent;cursor:pointer;text-align:left;color:#2B2724" style-hover="background:#F2EDE6">
          <span style="width:36px;height:36px;border-radius:50%;background:#E9C9B4;display:flex;align-items:center;justify-content:center;font:700 14px 'Plus Jakarta Sans',sans-serif;position:relative">AR<sc-if value="{{ expired }}"><span style="position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:#C0503F;border:2px solid #F8F5F0"></span></sc-if></span>
          <span style="display:flex;flex-direction:column;min-width:0;flex:1"><span style="font:600 14px 'Plus Jakarta Sans',sans-serif">Ana Ribeiro</span><span style="font:400 12px 'Plus Jakarta Sans',sans-serif;color:#7C756C">@ana.cozinha</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C756C" stroke-width="2" stroke-linecap="round"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
        </button>
      </aside>
    </sc-if>

    <main style="flex:1;min-width:0;display:flex;flex-direction:column">
      <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
        <header style="position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;background:#F8F5F0;border-bottom:1px solid #ECE6DD">
          <button onClick="{{ goDash }}" style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;color:#2B2724">
            <span style="width:24px;height:24px;border-radius:8px 8px 8px 2px;background:#F08C6E;display:block"></span>
            <span style="font:700 20px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em">manochat</span>
          </button>
          <button onClick="{{ toggleMenu }}" aria-label="Menu da conta" style="white-space:nowrap;width:44px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer">
            <span style="width:36px;height:36px;border-radius:50%;background:#E9C9B4;display:flex;align-items:center;justify-content:center;font:700 14px 'Plus Jakarta Sans',sans-serif;color:#2B2724;position:relative">AR<sc-if value="{{ expired }}"><span style="position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:#C0503F;border:2px solid #F8F5F0"></span></sc-if></span>
          </button>
        </header>
      </sc-if>

      <sc-if value="{{ expired }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px clamp(16px,4vw,40px);background:#FCEDE9;border-bottom:1px solid #F4D5CD;color:#7A3326">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
          <div style="flex:1;min-width:220px;font:400 14px/1.45 'Plus Jakarta Sans',sans-serif;text-wrap:pretty"><strong style="font-weight:600">Sua conexão com o Instagram expirou.</strong> As automações estão pausadas até você reconectar — leva uns 20 segundos.</div>
          <button onClick="{{ reconnect }}" style="height:40px;padding:0 16px;border-radius:11px;border:none;background:#2B2724;color:#FFFFFF;font:600 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;white-space:nowrap">Reconectar agora</button>
        </div>
      </sc-if>

      <div style="flex:1;width:100%;max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 40px">
        <sc-if value="{{ is.onboarding }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Onboarding" in-shell="{{ true }}" expired="{{ expired }}" on-reconnect="{{ reconnect }}" on-create="{{ newAuto }}" on-skip="{{ goDash }}" has-automations="{{ hasAutos }}" hint-size="100%,700px"></dc-import>
        </sc-if>
        <sc-if value="{{ is.dashboard }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Dashboard" in-shell="{{ true }}" demo-state="{{ demo }}" on-reconnect="{{ reconnect }}" on-new="{{ newAuto }}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{ is.automations }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Automations" in-shell="{{ true }}" automations="{{ automations }}" posts="{{ posts }}" demo-state="{{ demo }}" on-new="{{ newAuto }}" on-edit="{{ editAuto }}" on-toggle="{{ toggleAuto }}" hint-size="100%,700px"></dc-import>
        </sc-if>
        <sc-if value="{{ is.editor }}" hint-placeholder-val="{{ false }}">
          <dc-import name="AutomationEditor" in-shell="{{ true }}" automation="{{ editing }}" posts="{{ posts }}" profile="{{ profile }}" mobile="{{ mobile }}" on-save="{{ saveAuto }}" on-cancel="{{ goAutos }}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{ is.inbox }}" hint-placeholder-val="{{ false }}">
          <dc-import name="Inbox" in-shell="{{ true }}" mobile="{{ mobile }}" demo-state="{{ demo }}" hint-size="100%,700px"></dc-import>
        </sc-if>
        <sc-if value="{{ is.bioEditor }}" hint-placeholder-val="{{ false }}">
          <dc-import name="BioEditor" in-shell="{{ true }}" profile="{{ profile }}" config="{{ bio }}" items="{{ bioItems }}" posts="{{ posts }}" mobile="{{ mobile }}" on-change="{{ setBio }}" on-open-public="{{ goPublic }}" on-toast="{{ toast }}" hint-size="100%,900px"></dc-import>
        </sc-if>
      </div>
      <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}"><div style="height:76px"></div></sc-if>
    </main>
  </div>

  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <nav style="position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:68px;padding-bottom:env(safe-area-inset-bottom);background:#FFFFFF;border-top:1px solid #ECE6DD">
      <button onClick="{{ goDash }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;color:{{ tab.dash.fg }};font:500 11px 'Plus Jakarta Sans',sans-serif;cursor:pointer;border-top:2px solid {{ tab.dash.bar }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Painel</button>
      <button onClick="{{ goAutos }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;color:{{ tab.autos.fg }};font:500 11px 'Plus Jakarta Sans',sans-serif;cursor:pointer;border-top:2px solid {{ tab.autos.bar }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>Automações</button>
      <button onClick="{{ goInbox }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;color:{{ tab.inbox.fg }};font:500 11px 'Plus Jakarta Sans',sans-serif;cursor:pointer;border-top:2px solid {{ tab.inbox.bar }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>Entrada</button>
      <button onClick="{{ goBioEditor }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;color:{{ tab.bio.fg }};font:500 11px 'Plus Jakarta Sans',sans-serif;cursor:pointer;border-top:2px solid {{ tab.bio.bar }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Bio</button>
    </nav>
  </sc-if>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:40;background:rgba(27,23,18,0.18)"></div>
    <div style="position:fixed;z-index:41;top:{{ pop.top }};bottom:{{ pop.bottom }};left:{{ pop.left }};right:{{ pop.right }};width:272px;padding:8px;border-radius:18px;background:#FFFFFF;border:1px solid #ECE6DD;box-shadow:0 18px 50px rgba(27,23,18,0.18);animation:mup .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;gap:2px">
      <div style="padding:10px 12px 12px;border-bottom:1px solid #F3EEE7;margin-bottom:4px;display:flex;flex-direction:column;gap:4px">
        <span style="font:600 15px 'Plus Jakarta Sans',sans-serif">Ana Ribeiro</span>
        <span style="font:400 13px 'Plus Jakarta Sans',sans-serif;color:#7C756C">@ana.cozinha · Conta de criador</span>
        <span style="display:flex;align-items:center;gap:6px;font:500 12px 'Plus Jakarta Sans',sans-serif;color:{{ connColor }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ connColor }}"></span>{{ connLabel }}</span>
      </div>
      <button onClick="{{ reconnect }}" style="white-space:nowrap;height:44px;padding:0 12px;border:none;border-radius:10px;background:transparent;text-align:left;font:500 14px 'Plus Jakarta Sans',sans-serif;color:#2B2724;cursor:pointer" style-hover="background:#F8F5F0">Reconectar Instagram</button>
      <button onClick="{{ goPublic }}" style="white-space:nowrap;height:44px;padding:0 12px;border:none;border-radius:10px;background:transparent;text-align:left;font:500 14px 'Plus Jakarta Sans',sans-serif;color:#2B2724;cursor:pointer" style-hover="background:#F8F5F0">Ver minha página pública</button>
      <button onClick="{{ goOnboarding }}" style="white-space:nowrap;height:44px;padding:0 12px;border:none;border-radius:10px;background:transparent;text-align:left;font:500 14px 'Plus Jakarta Sans',sans-serif;color:#2B2724;cursor:pointer" style-hover="background:#F8F5F0">Primeiros passos</button>
      <div style="height:1px;background:#F3EEE7;margin:4px 0"></div>
      <button onClick="{{ goPrivacy }}" style="white-space:nowrap;height:40px;padding:0 12px;border:none;border-radius:10px;background:transparent;text-align:left;font:400 13px 'Plus Jakarta Sans',sans-serif;color:#7C756C;cursor:pointer" style-hover="background:#F8F5F0">Política de Privacidade</button>
      <button onClick="{{ goDeletion }}" style="white-space:nowrap;height:40px;padding:0 12px;border:none;border-radius:10px;background:transparent;text-align:left;font:400 13px 'Plus Jakarta Sans',sans-serif;color:#7C756C;cursor:pointer" style-hover="background:#F8F5F0">Exclusão de dados</button>
      <div style="height:1px;background:#F3EEE7;margin:4px 0"></div>
      <button onClick="{{ logout }}" style="white-space:nowrap;height:44px;padding:0 12px;border:none;border-radius:10px;background:transparent;text-align:left;font:600 14px 'Plus Jakarta Sans',sans-serif;color:#C0503F;cursor:pointer" style-hover="background:#FCEDE9">Sair</button>
    </div>
  </sc-if>
</sc-if>

<sc-if value="{{ reconnecting }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(244,239,230,0.86);backdrop-filter:blur(6px)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px;max-width:340px;text-align:center;border-radius:22px;background:#FFFFFF;border:1px solid #ECE6DD">
      <span style="width:34px;height:34px;border-radius:50%;border:3px solid #ECE6DD;border-top-color:#F08C6E;animation:mspin .8s linear infinite;display:block"></span>
      <span style="font:700 20px/1.2 'Plus Jakarta Sans',sans-serif;letter-spacing:-0.02em">Reconectando ao Instagram…</span>
      <span style="font:400 14px/1.5 'Plus Jakarta Sans',sans-serif;color:#7C756C">Na janela do Instagram, deixe todas as permissões marcadas.</span>
    </div>
  </div>
</sc-if>

<sc-if value="{{ toastMsg }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:#2B2724;color:#FFFFFF;font:500 14px 'Plus Jakarta Sans',sans-serif;box-shadow:0 12px 30px rgba(27,23,18,0.25);animation:mup .4s cubic-bezier(.2,.7,.2,1);max-width:calc(100vw - 32px)">
    <span style="width:8px;height:8px;border-radius:50%;background:#F08C6E;flex-shrink:0"></span>{{ toastMsg }}
  </div>
</sc-if>
</x-dc>

 dmInitial:'Oi! Quer meus presets de foto? 📸',btnLabel:'Quero',
 dmFollower:'Baixe aqui: {link}',dmNonFollower:'Me segue e toca no botão de novo pra liberar 💛',
 requireFollow:true,url:'',linkButton:true,linkLabel:'Baixar presets'}];
const BIO={theme:'papel',shape:'arredondado',bio:'Receitas rápidas pra quem não tem tempo 🍋 Comenta a palavra no vídeo que eu te mando na DM.',photo:null,showFollowers:true,showPosts:true,postLayout:'grid3',
 order:['a1','a3','m1','m2'],hidden:[],manual:[{id:'m1',label:'Meu e-book de receitas',url:'https://anaribeiro.com.br/ebook'},{id:'m2',label:'Loja de utensílios',url:'https://loja.anaribeiro.com.br'}]};
const PROFILE={user:'ana.cozinha',name:'Ana Ribeiro',followers:'48,2 mil',initials:'AR',tone:'#E9C9B4'};
const KEY='manochat.v1';
class Component extends DCLogic {
  get P(){ return (window.MC&&window.MC.posts)||[]; }
  state = this.load();
  load(){
    let s={}; try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
    return {route:s.route||'landing',editingId:s.editingId??null,automations:s.automations||SEED,bio:{...BIO,...(s.bio||{})},
      mobile:typeof window!=='undefined'&&window.innerWidth<820,menu:false,fixed:false,reconnecting:false,toast:null};
  }
  componentDidMount(){ if(!window.MC){this.mcI=setInterval(()=>{if(window.MC){clearInterval(this.mcI);this.forceUpdate()}},60)} this.onR=()=>this.setState({mobile:window.innerWidth<820}); window.addEventListener('resize',this.onR); }
  componentWillUnmount(){ window.removeEventListener('resize',this.onR); }
  componentDidUpdate(pp){
    const s=this.state;
    try{localStorage.setItem(KEY,JSON.stringify({route:s.route,editingId:s.editingId,automations:s.automations,bio:s.bio}))}catch(e){}
    if(pp.tokenExpired!==this.props.tokenExpired&&s.fixed) this.setState({fixed:false});
  }
  go(route,extra={}){ this.setState({route,menu:false,...extra}); window.scrollTo(0,0); }
  toast=(msg)=>{ clearTimeout(this.tt); this.setState({toast:msg}); this.tt=setTimeout(()=>this.setState({toast:null}),2600); };
  renderVals(){
    const s=this.state,r=s.route,m=s.mobile;
    const demo=this.props.demoState??'normal';
    const expired=(this.props.tokenExpired??false)&&!s.fixed;
    const shell=['onboarding','dashboard','automations','editor','inbox','bioEditor'].includes(r);
    const on=(k)=>({bg:k?'#FFFFFF':'transparent',fg:k?'#2B2724':'#4F4841',sh:k?'0 1px 2px rgba(27,23,18,.06), 0 4px 14px rgba(27,23,18,.05)':'none'});
    const tb=(k)=>({fg:k?'#2B2724':'#9A938A',bar:k?'#F08C6E':'transparent'});
    const act={dash:r==='dashboard',autos:r==='automations'||r==='editor',inbox:r==='inbox',bio:r==='bioEditor'};
    const autos=s.automations;
    const actives=autos.filter(a=>a.status==='active');
    const all=[...actives.map(a=>({id:a.id,kind:'auto',label:a.name,keyword:a.keywords[0]||'',postId:a.target==='specific'?a.postIds[0]:null})),
      ...s.bio.manual.map(l=>({id:l.id,kind:'manual',label:l.label,url:l.url}))];
    const ix=(id)=>{const i=s.bio.order.indexOf(id);return i<0?999:i};
    all.sort((a,b)=>ix(a.id)-ix(b.id));
    const bioItems=all.map(it=>({...it,hidden:s.bio.hidden.includes(it.id)}));
    const hasAutos=autos.length>0&&demo!=='vazio';
    return {
      route:r,demo,expired,mobile:m,desktop:!m,posts:this.P,profile:PROFILE,automations:demo==='vazio'?[]:autos,bio:s.bio,bioItems,bioVisible:bioItems.filter(i=>!i.hidden),hasAutos,
      editing:autos.find(a=>a.id===s.editingId)||null,
      is:{landing:r==='landing',legal:r==='privacy'||r==='deletion',publicBio:r==='publicBio',shell,onboarding:r==='onboarding',dashboard:r==='dashboard',automations:r==='automations',editor:r==='editor',inbox:r==='inbox',bioEditor:r==='bioEditor'},
      nav:{dash:on(act.dash),autos:on(act.autos),inbox:on(act.inbox),bio:on(act.bio)},
      tab:{dash:tb(act.dash),autos:tb(act.autos),inbox:tb(act.inbox),bio:tb(act.bio)},
      step3:hasAutos?'#2B2724':'#ECE6DD',stepsLabel:hasAutos?'Tudo pronto · 3 de 3':'2 de 3 concluídos',
      menuOpen:s.menu,
      pop:m?{top:'64px',bottom:'auto',left:'auto',right:'12px'}:{top:'auto',bottom:'76px',left:'16px',right:'auto'},
      connColor:expired?'#C0503F':'#3F8F64',connLabel:expired?'Conexão expirada':'Conectada',
      reconnecting:s.reconnecting,toastMsg:s.toast,toast:this.toast,
      toggleMenu:()=>this.setState({menu:!s.menu}),closeMenu:()=>this.setState({menu:false}),
      login:()=>this.go('onboarding'),logout:()=>this.go('landing'),
      goLegal:(k)=>this.go(k,{legalFrom:r}),goPrivacy:()=>this.go('privacy',{legalFrom:r}),goDeletion:()=>this.go('deletion',{legalFrom:r}),
      legalBack:()=>this.go(s.legalFrom&&s.legalFrom!=='privacy'&&s.legalFrom!=='deletion'?s.legalFrom:'landing'),
      goDash:()=>this.go('dashboard'),goAutos:()=>this.go('automations'),goInbox:()=>this.go('inbox'),goBioEditor:()=>this.go('bioEditor'),
      goOnboarding:()=>this.go('onboarding'),goPublic:()=>this.go('publicBio'),
      newAuto:()=>this.go('editor',{editingId:null}),editAuto:(id)=>this.go('editor',{editingId:id}),
      toggleAuto:(id)=>{const a=autos.find(x=>x.id===id);const next=a.status==='active'?'paused':'active';
        this.setState({automations:autos.map(x=>x.id===id?{...x,status:next}:x)});this.toast(next==='active'?`"${a.name}" está ativa`:`"${a.name}" foi pausada`);},
      saveAuto:(a,msg)=>{const exists=autos.some(x=>x.id===a.id);const id=a.id||('a'+Date.now());const na={...a,id};
        this.setState({automations:exists?autos.map(x=>x.id===a.id?na:x):[na,...autos],editingId:id});this.toast(msg||'Automação salva');
        if(a.status!=='draft') this.go('automations');},
      setBio:(patch)=>this.setState({bio:{...s.bio,...patch}}),
      reconnect:()=>{this.setState({menu:false,reconnecting:true});setTimeout(()=>{this.setState({reconnecting:false,fixed:true});this.toast('Instagram reconectado. Tudo funcionando!')},1600)}
    };
  }
}
</script>
