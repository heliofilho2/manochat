<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;background:{{ tone }};color:{{ ink }};overflow:hidden;border-radius:inherit;display:flex;flex-direction:column;justify-content:flex-end">
  <div style="position:absolute;top:7px;right:7px;display:flex;align-items:center;justify-content:center;opacity:0.85">
    <sc-if value="{{ isReel }}" hint-placeholder-val="{{ false }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"></path></svg>
    </sc-if>
    <sc-if value="{{ isCarousel }}" hint-placeholder-val="{{ false }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="13" height="14" rx="2"></rect><path d="M8 3h11a2 2 0 0 1 2 2v11"></path></svg>
    </sc-if>
  </div>
  <sc-if value="{{ showCaption }}" hint-placeholder-val="{{ true }}">
    <span style="padding:8px 9px;font:600 11px/1.25 'Plus Jakarta Sans',sans-serif;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ caption }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:200},&quot;post&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p=this.props.post||{tone:'#D8D0C0',ink:'#2B2724',type:'Imagem',caption:''};
    return {tone:p.tone,ink:p.ink,caption:p.caption,isReel:p.type==='Reel',isCarousel:p.type==='Carrossel',showCaption:this.props.caption!==false};
  }
}
</script>
</body>
</html>
